apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: resumeforge
  labels:
    app: worker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          image: resumeforge/worker-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/resumeforge
            - name: SPRING_DATASOURCE_USERNAME
              value: resumeforge
            - name: SPRING_DATASOURCE_PASSWORD
              value: resumeforge123
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: OLLAMA_API_URL
              value: http://host.minikube.internal:11434/v1/chat/completions
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: resumeforge
spec:
  selector:
    app: worker-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
