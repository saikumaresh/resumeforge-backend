server:
  port: ${PORT:8081}

spring:
  application:
    name: resume-service

  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/resumeforge?TimeZone=Asia/Kolkata}
    username: ${DATABASE_USERNAME:resumeforge}
    password: ${DATABASE_PASSWORD:resumeforge123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET:resumeforge-jwt-secret-key-must-be-at-least-32-characters-long}

google:
  client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

ollama:
  api-url: ${OLLAMA_API_URL:https://ollama.com/v1/chat/completions}
  model: ${OLLAMA_MODEL:gemma3:12b}
  api-key: ${OLLAMA_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

logging:
  level:
    com.resumeforge: ${LOG_LEVEL:INFO}
