services:
  # ── API service (resume-service) ─────────────────────────────────────────────
  - type: web
    name: resumeforge-api
    runtime: docker
    dockerfilePath: ./resume-service/Dockerfile
    dockerContext: .
    plan: free          # upgrade to "starter" ($7/mo) for always-on
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumeforge-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: resumeforge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: resumeforge-db
          property: password
      - key: REDIS_URL
        sync: false       # set manually: Upstash Redis connection string (rediss://...)
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false       # set manually from Upstash dashboard
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false       # set manually from Upstash dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false       # set to your Vercel URL once deployed
      - key: OLLAMA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: LOG_LEVEL
        value: WARN

  # ── Worker service ────────────────────────────────────────────────────────────
  # Note: Render free tier does not support type:worker; using type:web instead.
  # The Spring Boot actuator provides a health endpoint; Kafka consumption still works.
  - type: web
    name: resumeforge-worker
    runtime: docker
    dockerfilePath: ./worker-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumeforge-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: resumeforge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: resumeforge-db
          property: password
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: WARN

databases:
  - name: resumeforge-db
    plan: free           # 1 GB storage, 97-day retention

# Redis: Using Upstash (external). Set REDIS_URL manually in Render env vars.
