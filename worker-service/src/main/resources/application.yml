server:
  port: ${PORT:8082}

spring:
  application:
    name: worker-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumeforge}
    username: ${DATABASE_USERNAME:resumeforge}
    password: ${DATABASE_PASSWORD:resumeforge123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.resumeforge.*,java.util"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

ollama:
  api-url: ${OLLAMA_API_URL:https://ollama.com/v1/chat/completions}
  model: ${OLLAMA_MODEL:gemma3:12b}
  api-key: ${OLLAMA_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.resumeforge: ${LOG_LEVEL:INFO}
