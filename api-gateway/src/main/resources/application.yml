server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Authentication must be reachable through the gateway, otherwise a
        # client cannot obtain a token without bypassing it. Rate limiting for
        # these paths is enforced by RateLimitFilter in resume-service.
        - id: auth-service
          uri: ${RESUME_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: resume-service
          uri: ${RESUME_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/resumes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
        - id: worker-service
          uri: ${WORKER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/exports/**
      default-filters:
        - AddRequestHeader=X-Gateway-Source, resumeforge-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

auth:
  jwt:
    secret: ${JWT_SECRET:NOT_SET_IN_ENV_MUST_BE_32_CHARS_MIN}

# JWT Route Protection Configuration (Phase 1.7 fix)
jwt:
  unprotected-routes:
    - /actuator
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/health
    - /health
    - /metrics
    - /prometheus

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.resumeforge.gateway: ${LOG_LEVEL:INFO}
