server:
  port: 8082

spring:
  application:
    name: worker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/resumeforge?TimeZone=Asia/Kolkata
    username: resumeforge
    password: resumeforge123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.resumeforge.*,java.util"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map

ollama:
  api-url: https://api.ollama.com/v1/chat/completions
  model: llama3.2
  api-key: ${OLLAMA_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.resumeforge: DEBUG
